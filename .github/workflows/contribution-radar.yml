name: Refresh contribution radar

on:
  schedule:
    # 03:17 UTC daily. GitHub queues cron runs, so it may drift a few minutes.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without this the run fails every night with a bare "GITHUB_TOKEN is not
      # set", which just becomes noise in the inbox. Say what is actually wrong.
      - name: Check the PAT is configured
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: |
          if [ -z "$CONTRIB_TOKEN" ]; then
            echo "::error::Secret CONTRIB_TOKEN is not set. Create a classic PAT" \
                 "owned by Kunal2703 with the 'read:user' scope and add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Regenerate radar
        env:
          # Must be a classic PAT owned by Kunal2703 with `read:user` (and
          # `read:org` for org-owned private repos). NOT `repo` - see the note
          # in the script; `repo` alone still yields a public-only split. The built-in
          # GITHUB_TOKEN runs as github-actions[bot] and can only see public
          # contributions — 88% of the commit history is private, so that would
          # redraw the chart with the wrong shape. The script refuses to run
          # with a token belonging to anyone but the profile owner.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: python3 scripts/gen-contribution-radar.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- assets/contribution-radar.svg; then
            echo "No change since the last run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution radar" -- assets/contribution-radar.svg
          git push
