name: Refresh latest writing

# Weekly is plenty for a blog feed, and the job can be run by hand from the
# Actions tab whenever a new article goes out.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the Latest writing block
        run: python3 scripts/update-latest-posts.py --count 5

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh latest writing from Hashnode"
          git push
